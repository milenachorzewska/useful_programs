<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Rozkład wektora prędkości dla 36 m/s i 34 stopni</title>
  <desc id="desc">Wektor prędkości 36 metrów na sekundę rozłożony na składową poziomą 29,85 metra na sekundę oraz pionową 20,13 metra na sekundę.</desc>
  <defs>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#dc2626"/></marker>
    <marker id="yellowArrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#eab308"/></marker>
  </defs>
  <text x="110" y="55" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#000000">Rozkład prędkości początkowej</text>
  <text x="110" y="87" font-family="Arial,sans-serif" font-size="19" fill="#000000">v₀ = 36 m/s, kąt θ = 34°</text>
  <path d="M115 350H810" stroke="#000000" stroke-width="3"/>
  <path d="M160 395V110" stroke="#000000" stroke-width="3"/>
  <path d="M160 350L510 114" stroke="#2563eb" stroke-width="6" marker-end="url(#blueArrow)"/>
  <path d="M160 350H510" stroke="#dc2626" stroke-width="5" marker-end="url(#redArrow)"/>
  <path d="M510 350V114" stroke="#eab308" stroke-width="5" marker-end="url(#yellowArrow)"/>
  <path d="M160 350L510 350L510 114" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 7"/>
  <path d="M230 350A70 70 0 0 0 218 311" fill="none" stroke="#000000" stroke-width="2.5"/>
  <circle cx="160" cy="350" r="7" fill="#000000"/>
  <text x="238" y="285" font-family="Arial,sans-serif" font-size="21" fill="#000000">34°</text>
  <text x="335" y="204" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#000000">v₀ = 36 m/s</text>
  <text x="275" y="395" font-family="Arial,sans-serif" font-size="21" fill="#000000">vₓ₀ = 29,85 m/s</text>
  <text x="535" y="232" font-family="Arial,sans-serif" font-size="21" fill="#000000">vᵧ₀ = 20,13 m/s</text>
  <text x="787" y="385" font-family="Arial,sans-serif" font-size="21" fill="#000000">x</text>
  <text x="143" y="102" font-family="Arial,sans-serif" font-size="21" fill="#000000">y</text>
</svg>