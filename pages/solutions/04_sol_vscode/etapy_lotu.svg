  <path d="M170 230H244" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M398 153H470" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M660 225L697 282" stroke="#eab308" stroke-width="4" marker-end="url(#yellowArrow)"/>
  <text x="78" y="390" font-family="Arial,sans-serif" font-size="19" fill="#000000">wyrzut</text>
  <text x="350" y="115" font-family="Arial,sans-serif" font-size="19" fill="#000000">wierzchołek: vᵧ = 0</text>
  <text x="757" y="390" font-family="Arial,sans-serif" font-size="19" fill="#000000">lądowanie</text>
  <text x="165" y="225" font-family="Arial,sans-serif" font-size="19" fill="#000000">wznoszenie</text>
  <text x="690" y="210" font-family="Arial,sans-serif" font-size="19" fill="#000000">opadanie</text>
  <text x="96" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#000000">Bez oporu: pozioma składowa prędkości jest stała</text>
</svg>