<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Etapy lotu pocisku</title>
  <desc id="desc">Tor paraboliczny bez oporu z oznaczonym startem, wierzchołkiem i lądowaniem.</desc>
  <defs>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#dc2626"/></marker>
    <marker id="yellowArrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#eab308"/></marker>
  </defs>
  <path d="M90 350H830" stroke="#000000" stroke-width="3"/>
  <path d="M105 330C250 90 560 90 800 350" fill="none" stroke="#2563eb" stroke-width="5"/>
  <circle cx="105" cy="330" r="10" fill="#dc2626"/>
  <circle cx="420" cy="153" r="9" fill="#eab308"/>
  <circle cx="800" cy="350" r="10" fill="#2563eb"/>
